<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Object Detect</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font-family: system-ui, sans-serif; }
  #stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #hud { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,.75)); display: flex; flex-direction: column; gap: 8px; }
  #row { display: flex; gap: 8px; align-items: center; }
  button { flex: 1; padding: 12px; font-size: 16px; border: 0; border-radius: 10px;
    background: #2b7de9; color: #fff; }
  button.secondary { background: #444; flex: 0 0 auto; }
  button:disabled { opacity: .5; }
  .pickInput { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 100px; cursor: pointer; }
  .pick { position: relative; overflow: hidden; display: none; padding: 14px; text-align: center; font-size: 16px; font-weight: 600;
    border-radius: 10px; background: #e8a317; color: #000; cursor: pointer; }
  label { font-size: 13px; display: flex; gap: 8px; align-items: center; }
  input[type=range] { flex: 1; }
  #status { position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 8px; right: 8px;
    font-size: 13px; text-shadow: 0 0 4px #000; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="status">Tap Start to begin.</div>
  <div id="hud">
    <label id="pickBtn" class="pick">Choose model file (.tflite)
      <input id="modelFile" type="file" class="pickInput">
    </label>
    <label>Min confidence <input id="conf" type="range" min="20" max="90" value="50"><span id="confVal">50%</span></label>
    <div id="row">
      <button id="start">Start</button>
      <button id="flip" class="secondary" disabled>Flip camera</button>
    </div>
  </div>
</div>

<script type="module">
import { ObjectDetector, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite";

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const startBtn = document.getElementById("start");
const flipBtn = document.getElementById("flip");
const conf = document.getElementById("conf");
const confVal = document.getElementById("confVal");

let detector = null;
let stream = null;
let facing = "environment";
let running = false;
let lastVideoTime = -1;
let frames = 0, fpsStart = performance.now(), fps = 0;

conf.addEventListener("input", () => {
  confVal.textContent = conf.value + "%";
  if (detector) detector.setOptions({ scoreThreshold: conf.value / 100 });
});

async function probe(url, what) {
  let r;
  try { r = await fetch(url); }
  catch (e) { throw new Error(`Could not download ${what} (${new URL(url).host}). Check internet, VPN/ad-blocker, or private DNS.`); }
  if (!r.ok) throw new Error(`${what} download returned HTTP ${r.status}`);
  return r;
}

// Tries a copy next to this page first, then Google's host, then asks you to pick the file.
async function loadModelBytes() {
  for (const url of ["./efficientdet_lite0.tflite", MODEL]) {
    try {
      const r = await fetch(url);
      if (!r.ok) continue;
      const bytes = new Uint8Array(await r.arrayBuffer());
      if (bytes.length > 100000) return bytes; // ignore HTML error pages
    } catch (e) { console.warn("Model fetch failed:", url, e); }
  }
  statusEl.textContent = "Couldn't download the model. Tap 'Choose file' and pick efficientdet_lite0.tflite.";
  const input = document.getElementById("modelFile");
  const pickBtn = document.getElementById("pickBtn");
  pickBtn.style.display = "block";
  return await new Promise((resolve) => {
    input.onchange = async () => {
      if (!input.files[0]) return;
      pickBtn.style.display = "none";
      statusEl.textContent = "Loading model…";
      resolve(new Uint8Array(await input.files[0].arrayBuffer()));
    };
  });
}

async function createDetector() {
  statusEl.textContent = "Checking MediaPipe files…";
  await probe(`${WASM}/vision_wasm_internal.js`, "MediaPipe runtime");
  statusEl.textContent = "Loading model…";
  const modelBytes = await loadModelBytes();

  const fileset = await FilesetResolver.forVisionTasks(WASM);
  const make = (delegate) => ObjectDetector.createFromOptions(fileset, {
    baseOptions: { modelAssetBuffer: modelBytes, delegate },
    runningMode: "VIDEO",
    scoreThreshold: conf.value / 100,
    maxResults: 10,
  });
  try { return await make("GPU"); }
  catch (e) { console.warn("GPU delegate failed, using CPU", e); return await make("CPU"); }
}

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false,
  });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
}

function draw(result) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineWidth = Math.max(2, canvas.width / 320);
  ctx.font = `${Math.max(14, canvas.width / 45)}px system-ui, sans-serif`;
  ctx.textBaseline = "top";
  for (const d of result.detections) {
    const b = d.boundingBox;
    const c = d.categories[0];
    const label = `${c.categoryName} ${Math.round(c.score * 100)}%`;
    ctx.strokeStyle = "#00e676";
    ctx.strokeRect(b.originX, b.originY, b.width, b.height);
    const w = ctx.measureText(label).width + 8;
    const h = parseInt(ctx.font, 10) + 6;
    const y = Math.max(0, b.originY - h);
    ctx.fillStyle = "#00e676";
    ctx.fillRect(b.originX, y, w, h);
    ctx.fillStyle = "#000";
    ctx.fillText(label, b.originX + 4, y + 3);
  }
}

function loop() {
  if (!running) return;
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = detector.detectForVideo(video, performance.now());
    draw(result);
    frames++;
    const now = performance.now();
    if (now - fpsStart >= 1000) {
      fps = frames * 1000 / (now - fpsStart);
      frames = 0; fpsStart = now;
      statusEl.textContent = `${fps.toFixed(0)} FPS · ${result.detections.length} object(s)`;
    }
  }
  requestAnimationFrame(loop);
}

startBtn.addEventListener("click", async () => {
  if (running) {
    running = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    startBtn.textContent = "Start";
    flipBtn.disabled = true;
    statusEl.textContent = "Stopped.";
    return;
  }
  startBtn.disabled = true;
  try {
    statusEl.textContent = "Loading model…";
    if (!detector) detector = await createDetector();
    statusEl.textContent = "Starting camera…";
    await startCamera();
    running = true;
    startBtn.textContent = "Stop";
    flipBtn.disabled = false;
    loop();
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Error: " + (err.message || err) +
      (location.protocol === "file:" ? " (camera needs HTTPS or localhost, not a file:// page)" : "");
  } finally {
    startBtn.disabled = false;
  }
});

flipBtn.addEventListener("click", async () => {
  facing = facing === "environment" ? "user" : "environment";
  try { await startCamera(); } catch (e) { statusEl.textContent = "Error: " + e.message; }
});
</script>
</body>
</html>
